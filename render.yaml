services:
  - type: web
    name: securechat-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: kkurui951@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "[]"
      - key: ENABLE_DOCS
        value: "false"
